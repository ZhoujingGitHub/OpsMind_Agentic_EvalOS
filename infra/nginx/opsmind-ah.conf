# /etc/nginx/sites-available/opsmind-ah  (product machine 114.55.40.170)
#
# AH's frontend is a separate Vite/React bundle that is not in the service image
# (.dockerignore excludes apps/web/dist and the service mounts no StaticFiles),
# so nginx serves it from disk. That also means the online AH commit and its
# production tag stay untouched by this entry.
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    ssl_certificate     /etc/nginx/ssl/opsmind-product/fullchain.pem;
    ssl_certificate_key /etc/nginx/ssl/opsmind-product/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    server_name ah.114-55-40-170.sslip.io;

    include /etc/nginx/opsmind-ah-access.conf;
    auth_basic "OpsMind Agent Harness";
    auth_basic_user_file /etc/nginx/opsmind-ah.htpasswd;

    # The frontend is a BrowserRouter SPA: deep links must fall back to index.html.
    location / {
        root /srv/opsmind-ah-web;
        try_files $uri $uri/ /index.html;
        limit_req zone=opsmind_ah burst=50 nodelay;
    }

    # Same-origin API. The bundle has this origin baked in at build time, so the
    # browser sends no preflight and OPSMIND_CORS_ORIGINS stays untouched.
    location /v2/ {
        limit_req zone=opsmind_ah burst=50 nodelay;
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 5s;
        proxy_read_timeout 600s;
    }
}
