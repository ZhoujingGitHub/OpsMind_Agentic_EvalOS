# /etc/nginx/sites-available/opsmind-lg  (product machine 114.55.40.170)
#
# LG serves its own frontend at /app from the same FastAPI process, so this is a
# straight reverse proxy. No port 80: acme.sh uses TLS-ALPN-01 on 443, and 80 on
# a mainland host gets replaced by the Aliyun ICP interception page anyway.
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    ssl_certificate     /etc/nginx/ssl/opsmind-product/fullchain.pem;
    ssl_certificate_key /etc/nginx/ssl/opsmind-product/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    server_name lg.114-55-40-170.sslip.io;

    location / {
        include /etc/nginx/opsmind-lg-access.conf;
        auth_basic "OpsMind LangGraph";
        auth_basic_user_file /etc/nginx/opsmind-lg.htpasswd;
        limit_req zone=opsmind_lg burst=50 nodelay;

        proxy_pass http://127.0.0.1:8081;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 5s;
        proxy_read_timeout 600s;
    }
}
