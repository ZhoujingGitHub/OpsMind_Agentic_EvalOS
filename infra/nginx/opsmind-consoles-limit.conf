# /etc/nginx/conf.d/opsmind-consoles-limit.conf  (product machine)
#
# One zone per candidate. Sharing a zone would let traffic on one console eat the
# other's allowance, which couples two systems that must stay independently
# comparable.
limit_req_zone $binary_remote_addr zone=opsmind_lg:10m rate=20r/s;
limit_req_zone $binary_remote_addr zone=opsmind_ah:10m rate=20r/s;
