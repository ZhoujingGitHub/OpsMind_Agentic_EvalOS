# /etc/nginx/sites-available/opsmind-evalos  (EvalOS machine 121.40.223.202)
#
# 2026-09-16: this file was stale. It still carried the pre-09-15
# `allow 111.55.79.0/24; deny all;` network ACL with no authentication, so
# deploying from Git would have re-locked the console to one carrier segment.
# Reconciled against the live config on the host.
server {
    listen 80;
    listen [::]:80;
    server_name 121-40-223-202.sslip.io;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name 121-40-223-202.sslip.io;

    ssl_certificate /etc/nginx/ssl/opsmind-evalos/fullchain.pem;
    ssl_certificate_key /etc/nginx/ssl/opsmind-evalos/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;

    # Exact machine-to-machine entry points. Both routes verify independent
    # product signatures and neither accepts the operator control-plane token.
    # They deliberately carry no auth_basic and do NOT include the demo-window
    # switch, so closing the page entry cannot break chains 3 and 4. Verified
    # 2026-09-16 from access logs: 423k relay claims plus 3.7k presence posts,
    # every one of them from the product machine 114.55.40.170.
    location ^~ /api/candidate-relay/ {
        client_max_body_size 2m;
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 5s;
        proxy_read_timeout 120s;
    }

    location = /api/candidate-presence {
        client_max_body_size 64k;
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 5s;
        proxy_read_timeout 120s;
    }

    # The three independent AI Judges run sequentially and can legitimately
    # take longer than the ordinary page timeout. Only the exact per-Trial
    # Judge endpoint receives this longer timeout; every ordinary API and page
    # keeps the default 120-second boundary below.
    #
    # Note: unlike the two routes above, this one DOES sit behind the switch and
    # behind auth_basic. In practice the evaluation kernel reaches the Judge over
    # the machine-local API on 127.0.0.1:3000, not through nginx -- access logs
    # show zero hits here in the current window -- so the switch does not affect
    # scoring. If a Judge ever has to be driven from outside, revisit this.
    location ~ ^/api/trials/[A-Za-z0-9_-]+/judge$ {
        include /etc/nginx/opsmind-console-access.conf;
        auth_basic "OpsMind EvalOS";
        auth_basic_user_file /etc/nginx/opsmind-console.htpasswd;
        limit_req zone=opsmind_console burst=100 nodelay;

        limit_except POST {
            deny all;
        }

        client_max_body_size 64k;
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 5s;
        proxy_read_timeout 900s;
    }

    location / {
        # Access is by credential, not by network location: the operator changes
        # WiFi and VPN often, and the previous carrier /24 also covered thousands
        # of unrelated subscribers. The console has no login of its own, so the
        # check runs here and the application is never reached without it.
        include /etc/nginx/opsmind-console-access.conf;
        auth_basic "OpsMind EvalOS";
        auth_basic_user_file /etc/nginx/opsmind-console.htpasswd;
        limit_req zone=opsmind_console burst=100 nodelay;

        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 5s;
        proxy_read_timeout 120s;
    }
}
