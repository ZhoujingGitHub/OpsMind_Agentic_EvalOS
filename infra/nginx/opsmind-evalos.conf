server {
    listen 80;
    listen [::]:80;
    server_name 121-40-223-202.sslip.io;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name 121-40-223-202.sslip.io;

    ssl_certificate /etc/nginx/ssl/opsmind-evalos/fullchain.pem;
    ssl_certificate_key /etc/nginx/ssl/opsmind-evalos/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;

    # Exact machine-to-machine entry points. Both routes verify independent
    # product signatures and neither accepts the operator control-plane token.
    location ^~ /api/candidate-relay/ {
        client_max_body_size 2m;
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 5s;
        proxy_read_timeout 120s;
    }

    location = /api/candidate-presence {
        client_max_body_size 64k;
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 5s;
        proxy_read_timeout 120s;
    }

    location / {
        # The operator's browser and public-IP lookup may use different IPs
        # inside the same carrier NAT pool. Permit that narrow pool, not all
        # Internet clients, while keeping 443 reachable for TLS-ALPN renewal.
        allow 111.55.79.0/24;
        deny all;

        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 5s;
        proxy_read_timeout 120s;
    }
}
